defaults:
  - base
  - _self_

candidate_preferred_spawn_biome:
  - plains

task_conf:
  - name: "craft"
    text: "craft_item:oak_planks"

reward_conf:
  - event: "craft_item"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "oak_planks"
    identity: "craft oak_planks"

need_crafting_table: False
need_gui: True

init_inventory:
  - slot: 0
    type: oak_log
    quantity: 1

