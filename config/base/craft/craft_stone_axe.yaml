defaults:
  - base
  - _self_

candidate_preferred_spawn_biome:
  - plains

task_conf:
  - name: "craft"
    text: "craft_item:stone_axe"

reward_conf:
  - event: "craft_item"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "stone_axe"
    identity: "craft stone_axe"

need_crafting_table: True
need_gui: True

init_inventory:
  - slot: 0
    type: cobblestone
    quantity: 3
  - slot: 1
    type: stick
    quantity: 2
  - slot: 2
    type: oak_planks
    quantity: 4
  - slot: 3
    type: crafting_table
    quantity: 1
