defaults:
  - base
  - _self_

candidate_preferred_spawn_biome:
  - plains

task_conf:
  - name: "craft"
    text: "craft_item:wooden_axe"

reward_conf:
  - event: "craft_item"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "wooden_axe"
    identity: "craft wooden_axe"

need_crafting_table: True
need_gui: True

init_inventory:
  - slot: 0
    type: oak_planks
    quantity: 7
  - slot: 1
    type: stick
    quantity: 2
  - slot: 2
    type: crafting_table
    quantity: 1
