defaults:
  - base
  - _self_

candidate_preferred_spawn_biome:
  - plains

task_conf:
  - name: "craft"
    text: "craft_item:stone_pickaxe"

reward_conf:
  - event: "craft_item"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "stone_pickaxe"
    identity: "craft stone_pickaxe"

need_crafting_table: True
need_gui: True

init_inventory:
  - slot: 0
    type: cobblestone
    quantity: 3
  - slot: 1
    type: stick
    quantity: 2

