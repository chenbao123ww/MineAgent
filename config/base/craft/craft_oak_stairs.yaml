defaults:
  - base
  - _self_

candidate_preferred_spawn_biome:
  - plains

task_conf:
  - name: "craft"
    text: "craft_item:oak_stairs"

reward_conf:
  - event: "craft_item"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "oak_stairs"
    identity: "craft oak_stairs"

need_crafting_table: True
need_gui: True

init_inventory:
  - slot: 0
    type: oak_planks
    quantity: 10
  - slot: 1
    type: crafting_table
    quantity: 1
