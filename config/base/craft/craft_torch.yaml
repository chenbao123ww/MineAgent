defaults:
  - base
  - _self_

candidate_preferred_spawn_biome:
  - plains

task_conf:
  - name: "craft"
    text: "craft_item:torch"

reward_conf:
  - event: "craft_item"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "torch"
    identity: "craft torch"

need_crafting_table: True
need_gui: True

init_inventory:
  - slot: 0
    type: coal
    quantity: 1
  - slot: 1
    type: stick
    quantity: 1

