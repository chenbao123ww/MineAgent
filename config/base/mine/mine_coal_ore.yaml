defaults:
  - base
  - _self_

candidate_preferred_spawn_biome:
  - "mountains"

task_conf:
  - name: "mine"
    text: "mine_block:coal_ore"

reward_conf:
  - event: "mine_block"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "coal_ore"
    identity: "mine coal_ore"

init_inventory:
  - slot: 0
    type: stone_pickaxe
    quantity: 1

