defaults:
  - base
  - _self_

task_conf:
  - name: "smelt"
    text: "craft_item:stone"

reward_conf:
  - event: "craft_item"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "stone"
    identity: "smelt stone"

init_inventory:
  - slot: 0
    type: furnace
    quantity: 1
  - slot: 20
    type: coal
    quantity: 10
  - slot: 14
    type: cobblestone
    quantity: 10

need_furnace: True
need_gui: True

worker:
  "smelt"
