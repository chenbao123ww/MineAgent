seed: 19961103
random_tp_range: 1000

fast_reset: True
start_time: 0
time_limit: 2000
candidate_preferred_spawn_biome:
  - plains
candidate_weather:
  - clear

camera_config:
  camera_binsize: 1
  camera_maxval: 10
  camera_mu: 20
  camera_quantization_scheme: "mu_law"

origin_resolution: [640, 360]
resize_resolution: [640, 360]

need_crafting_table: True
need_gui: True
inventory_distraction_level: "low"

task_conf:
  - name: "craft"
    text: "craft_item:bow"

reward_conf:
  - event: "craft_item"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "bow"
    identity: "craft bow"

# 3 sticks + 3 string in specific L-shaped pattern; iron_ingot and planks are distractors
init_inventory:
  - slot: 0
    type: stick
    quantity: 3
  - slot: 1
    type: string
    quantity: 3
  - slot: 9
    type: iron_ingot
    quantity: 2
  - slot: 10
    type: oak_planks
    quantity: 4

mobs: []

worker:
  "craft"
