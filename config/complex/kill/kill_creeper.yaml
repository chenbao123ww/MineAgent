seed: 3001859308298079279
random_tp_range: 1000

fast_reset: True
start_time: 0
time_limit: 2000
candidate_preferred_spawn_biome:
  - plains
preferred_spawn_biome: "plains"
candidate_weather:
  - clear

command:
  - "/time set night"

camera_config:
  camera_binsize: 1
  camera_maxval: 10
  camera_mu: 20
  camera_quantization_scheme: "mu_law"

origin_resolution: [640, 360]
resize_resolution: [640, 360]

need_crafting_table: False
need_gui: False
inventory_distraction_level: "zero"

task_conf:
  - name: "kill_entity"
    text: "kill_entity:creeper"

reward_conf:
  - event: "kill_entity"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "creeper"
    identity: "kill creeper"

# Creeper must be approached carefully — explodes if too close too long
mobs:
  - name: "creeper"
    number: 1
    range_x: [-2, 2]
    range_z: [4, 8]

# Iron sword; agent must hit-and-retreat to avoid explosion
init_inventory:
  - slot: 0
    type: "iron_sword"
    quantity: 1

worker:
  "mine"
