seed: 4181971900251588410
random_tp_range: 1000

fast_reset: True
start_time: 0
time_limit: 2000
candidate_preferred_spawn_biome:
  - plains
preferred_spawn_biome: "plains"
candidate_weather:
  - clear

# Night makes zombies more aggressive and harder to manage
command:
  - "/time set night"

camera_config:
  camera_binsize: 1
  camera_maxval: 10
  camera_mu: 20
  camera_quantization_scheme: "mu_law"

origin_resolution: [640, 360]
resize_resolution: [640, 360]

need_crafting_table: False
need_gui: False
inventory_distraction_level: "zero"

task_conf:
  - name: "kill_entity"
    text: "kill_entity:zombie (kill 3 zombies)"

reward_conf:
  - event: "kill_entity"
    max_reward_times: 3
    reward: 1.0
    objects:
      - "zombie"
    identity: "kill 3 zombies"

# 5 zombies spawned across a wider area; must kill at least 3
mobs:
  - name: "zombie"
    number: 5
    range_x: [-6, 6]
    range_z: [3, 15]

# Iron sword instead of diamond — harder combat
init_inventory:
  - slot: 0
    type: "iron_sword"
    quantity: 1

worker:
  "mine"
