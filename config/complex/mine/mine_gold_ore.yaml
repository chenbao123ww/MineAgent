seed: 1252682562537984348
random_tp_range: 1000

fast_reset: True
start_time: 0
time_limit: 2500
candidate_preferred_spawn_biome:
  - badlands
candidate_weather:
  - clear

camera_config:
  camera_binsize: 1
  camera_maxval: 10
  camera_mu: 20
  camera_quantization_scheme: "mu_law"

origin_resolution: [640, 360]
resize_resolution: [640, 360]

need_crafting_table: False
need_gui: False
inventory_distraction_level: "low"

task_conf:
  - name: "mine"
    text: "mine_block:gold_ore"

reward_conf:
  - event: "mine_block"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "gold_ore"
      - "deepslate_gold_ore"
      - "nether_gold_ore"
    identity: "mine gold ore"

# Badlands biome has gold near surface; iron pickaxe needed (stone pickaxe won't drop gold)
init_inventory:
  - slot: 0
    type: "iron_pickaxe"
    quantity: 1
  - slot: 9
    type: "stone_pickaxe"
    quantity: 1

mobs: []

worker:
  "mine"
