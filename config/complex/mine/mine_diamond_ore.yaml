seed: 19961103
random_tp_range: 1000

fast_reset: True
start_time: 0
time_limit: 3000
candidate_preferred_spawn_biome:
  - mountains
candidate_weather:
  - clear

camera_config:
  camera_binsize: 1
  camera_maxval: 10
  camera_mu: 20
  camera_quantization_scheme: "mu_law"

origin_resolution: [640, 360]
resize_resolution: [640, 360]

need_crafting_table: False
need_gui: False
inventory_distraction_level: "low"

task_conf:
  - name: "mine"
    text: "mine_block:deepslate_diamond_ore"

reward_conf:
  - event: "mine_block"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "deepslate_diamond_ore"
      - "diamond_ore"
    identity: "mine diamond ore"

# Agent must dig down to y=-58 or find a cave; iron pickaxe required (stone won't work)
init_inventory:
  - slot: 0
    type: "iron_pickaxe"
    quantity: 1
  - slot: 1
    type: "torch"
    quantity: 32
  - slot: 9
    type: "cobblestone"
    quantity: 16

mobs: []

worker:
  "mine"
