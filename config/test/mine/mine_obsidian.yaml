seed: 3780425614792207635
random_tp_range: 1000

fast_reset: True
start_time: 0
time_limit: 3000
candidate_preferred_spawn_biome:
  - plains
candidate_weather:
  - clear

# Place a 3-wide 3-tall obsidian wall 4 blocks in front of the player
command:
  - "/fill ~-1 ~ ~4 ~1 ~2 ~4 obsidian"

camera_config:
  camera_binsize: 1
  camera_maxval: 10
  camera_mu: 20
  camera_quantization_scheme: "mu_law"

origin_resolution: [640, 360]
resize_resolution: [640, 360]

need_crafting_table: False
need_gui: False
inventory_distraction_level: "low"

task_conf:
  - name: "mine"
    text: "mine_block:obsidian"

reward_conf:
  - event: "mine_block"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "obsidian"
    identity: "mine obsidian"

init_inventory:
  - slot: 0
    type: diamond_pickaxe
    quantity: 1
  - slot: 9
    type: iron_pickaxe
    quantity: 1

mobs: []

worker:
  "mine"
